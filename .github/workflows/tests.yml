name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions, sin push/PR

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        run: pytest api-tests/restful-booker -v --alluredir=allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results

  ui-tests:
    name: UI tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Run UI tests
        working-directory: ui-tests/booking-flow
        env:
          BROWSER: ${{ matrix.browser }}
        # --reruns: la app de demo (automationintesting.online) es un servicio
        # gratuito de terceros, no garantizado — ocasionalmente falla por red,
        # no por bugs del código (documentado en el README). Reintentar es la
        # respuesta estándar de CI a flakiness de infraestructura externa, no
        # una forma de esconder fallos reales.
        run: pytest -v --alluredir=allure-results --reruns 2 --reruns-delay 5

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui-${{ matrix.browser }}
          path: ui-tests/booking-flow/allure-results

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-ui-${{ matrix.browser }}
          path: ui-tests/booking-flow/traces
