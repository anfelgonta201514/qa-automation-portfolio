[pytest]
# api-tests no usa BDD, pero allure-pytest-bdd registra --alluredir al
# cargar el plugin igual que allure-pytest (choque documentado en
# ui-tests/booking-flow/pytest.ini) — si ambos paquetes están instalados
# en el mismo venv (requirements.txt único para todo el repo), CUALQUIER
# pytest de este repo los auto-carga y revienta al arrancar, aunque el
# comando no pida BDD. Se desactiva explícitamente el que no se usa acá.
addopts = -v -p no:allure_pytest_bdd
testpaths = tests
