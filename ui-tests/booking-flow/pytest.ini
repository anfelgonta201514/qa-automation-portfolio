[pytest]
# allure-pytest y allure-pytest-bdd NO pueden estar activos a la vez: los
# dos registran --alluredir y pytest revienta al cargar los plugins (no
# solo al usar la opción). Se desactivan ambos por defecto acá.
#
# Para reporte local, descomenta UN solo bloque de abajo (nunca los dos
# juntos) y vuelve a comentarlo cuando termines.
addopts = -v -p no:allure_pytest -p no:allure_pytest_bdd
    # --- Reporte normal (admin/booking/battery) ---
    # -p allure_pytest
    # --alluredir=allure-results
    # --clean-alluredir
    # --- Reporte BDD (agrega los steps Given/When/Then; no mezclar con el de arriba) ---
    # -p allure_pytest_bdd
    # --alluredir=allure-results
    # --clean-alluredir
testpaths = tests
markers =
    room_battery: batería parametrizada de creación de habitaciones (Admin)
    booking_battery: batería parametrizada del flujo de reserva
